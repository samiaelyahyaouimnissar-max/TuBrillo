<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | TuBrillo</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo">Tu<span>Brillo</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="personalizar.html">Personalizar</a></li>
            </ul>
        </div>
    </header>

    <section class="section" style="padding-top:110px;">
        <div class="container" style="max-width:800px;">
            <div class="section-header">
                <h2>Finalizar compra</h2>
                <p>Datos del cliente (se guardarán en la base de datos)</p>
            </div>

            <form id="checkoutForm" class="checkout-form">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nombre completo *</label>
                        <input type="text" name="nombre" required>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" name="email" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" name="telefono">
                    </div>
                    <div class="form-group">
                        <label>País</label>
                        <select name="pais">
                            <option>España</option>
                            <option>México</option>
                            <option>Argentina</option>
                            <option>Colombia</option>
                            <option>Otro</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Dirección de envío *</label>
                    <input type="text" name="direccion" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Ciudad *</label>
                        <input type="text" name="ciudad" required>
                    </div>
                    <div class="form-group">
                        <label>Código postal *</label>
                        <input type="text" name="cp" required>
                    </div>
                </div>

                <hr style="margin:30px 0; border-color:#f3d1e0;">

                <h3 style="margin-bottom:16px;">Método de pago</h3>
                <div class="payment-methods">
                    <label class="payment-option">
                        <input type="radio" name="pago" value="tarjeta" checked>
                        <i class="fas fa-credit-card"></i> Tarjeta
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="pago" value="paypal">
                        <i class="fab fa-paypal"></i> PayPal
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="pago" value="transferencia">
                        <i class="fas fa-university"></i> Transferencia
                    </label>
                </div>

                <div id="tarjetaFields" style="margin-top:20px;">
                    <div class="form-group">
                        <label>Número de tarjeta</label>
                        <input type="text" placeholder="ACCT-000003" maxlength="19">
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Caducidad</label>
                            <input type="text" placeholder="MM/AA">
                        </div>
                        <div class="form-group">
                            <label>CVV</label>
                            <input type="text" placeholder="123" maxlength="4">
                        </div>
                    </div>
                </div>

                <div class="order-summary" style="margin:30px 0; padding:20px; background:#fff5f8; border-radius:12px;">
                    <h4>Resumen del pedido</h4>
                    <div id="orderItems"></div>
                    <div class="price-big" style="margin-top:12px;">Total a pagar: <span id="orderTotal">0€</span></div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; padding:18px; font-size:1.1rem;">
                    <i class="fas fa-lock"></i> Pagar ahora de forma segura
                </button>
                <p style="text-align:center; margin-top:12px; font-size:0.85rem; color:#999;">
                    Tus datos se guardan en nuestra base de datos para el historial de pedidos
                </p>
            </form>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
